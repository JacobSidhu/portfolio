name: Portfolio Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose Terraform action"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_CLI_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_KEY_CLI_SECRET }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Node.js
        if: github.event.inputs.action == 'apply'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/lambda-functions/contact/package-lock.json

      - name: Install Node dependencies
        if: github.event.inputs.action == 'apply'
        run: npm ci

      - name: Install Lambda dependencies
        if: github.event.inputs.action == 'apply'
        working-directory: backend/lambda-functions/contact
        run: npm ci --omit=dev

      - name: Validate Lambda handler
        if: github.event.inputs.action == 'apply'
        working-directory: backend/lambda-functions/contact
        run: npm test

      - name: Check contact API URL
        if: github.event.inputs.action == 'apply'
        env:
          API_CONTACT_URL: ${{ vars.API_CONTACT_URL }}
        run: test -n "$API_CONTACT_URL"

      - name: Build frontend
        if: github.event.inputs.action == 'apply'
        env:
          VITE_API_CONTACT_URL: ${{ vars.API_CONTACT_URL }}
        run: npm run build

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Check Terraform formatting
        working-directory: infra/terraform
        run: terraform fmt -check

      - name: Initialize Terraform
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Validate Terraform
        working-directory: infra/terraform
        run: terraform validate

      - name: Plan Terraform
        if: github.event.inputs.action == 'apply'
        working-directory: infra/terraform
        env:
          TF_VAR_portfolio_bucket_name: ${{ vars.PORTFOLIO_BUCKET_NAME }}
          TF_VAR_contact_recipient_email: ${{ secrets.CONTACT_RECIPIENT_EMAIL }}
        run: terraform plan -input=false -out=tfplan

      - name: Apply Terraform
        if: github.event.inputs.action == 'apply'
        working-directory: infra/terraform
        env:
          TF_VAR_portfolio_bucket_name: ${{ vars.PORTFOLIO_BUCKET_NAME }}
          TF_VAR_contact_recipient_email: ${{ secrets.CONTACT_RECIPIENT_EMAIL }}
        run: terraform apply -input=false tfplan

      - name: Show Destroy Plan
        if: github.event.inputs.action == 'destroy'
        working-directory: infra/terraform
        env:
          TF_VAR_portfolio_bucket_name: ${{ vars.PORTFOLIO_BUCKET_NAME }}
          TF_VAR_contact_recipient_email: ${{ secrets.CONTACT_RECIPIENT_EMAIL }}
        run: terraform plan -destroy -input=false

      - name: Destroy Terraform Resources
        if: github.event.inputs.action == 'destroy'
        working-directory: infra/terraform
        env:
          TF_VAR_portfolio_bucket_name: ${{ vars.PORTFOLIO_BUCKET_NAME }}
          TF_VAR_contact_recipient_email: ${{ secrets.CONTACT_RECIPIENT_EMAIL }}
        run: terraform destroy -auto-approve -input=false
