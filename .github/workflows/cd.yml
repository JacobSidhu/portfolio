name: Continuous Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stag
          - prod
  pull_request:
    branches:
      - main

concurrency:
  group: development-CD
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build-and-validate:
    name: Deploy Terraform
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    env:
      TF_VAR_aws_region:  ${{ vars.AWS_REGION }}
      TF_VAR_site_bucket_name: ${{ vars.SITE_BUCKET_NAME }}
      TF_VAR_site_state_bucket_name: ${{ vars.SITE_STATE_BUCKET_NAME }}
      TF_VAR_bootstrap_state_bucket_name: ${{ vars.BOOTSTRAP_STATE_BUCKET_NAME }}
      TF_VAR_environment: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=1.15.0"

      - name: Terraform Init (S3 backend)
        working-directory: infra/terraform/envs/${{ inputs.environment || 'dev' }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.SITE_STATE_BUCKET_NAME }}" \
            -backend-config="key=${{ vars.SITE_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        working-directory: infra/terraform/envs/${{ inputs.environment || 'dev' }}
        run: terraform validate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        
      - name: Terraform Plan
        working-directory: infra/terraform/envs/${{ inputs.environment || 'dev' }}
        run: terraform plan -out=tfplan
